name: Build Slate JSON

on:
  schedule:
    - cron: "0 11 * * *"   # daily 11:00 UTC (6:00 AM EST)
  workflow_dispatch:       # allows you to run it manually from the GitHub website

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: America/New_York

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("hoopR","dplyr","jsonlite","tibble","httr2"), repos="https://cloud.r-project.org")'

      - name: Build slate_today.json
        run: |
          # Note: Ensure this file path matches where your R script is in the repo
          Rscript scripts/build_slate_today.R

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/slate_today.json
          # Only commit and push if there are actually changes to the data
          git diff --cached --quiet || (git commit -m "Update slate_today.json" && git push)