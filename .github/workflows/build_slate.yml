name: Build Slate JSON

on:
  schedule:
    - cron: "0 11 * * *"   # daily 11:00 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("hoopR","dplyr","jsonlite"), repos="https://cloud.r-project.org")'

      - name: Build slate_today.json
        run: |
          Rscript scripts/build_slate_today.R

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/slate_today.json
          git diff --cached --quiet || git commit -m "Update slate_today.json"
          git push
